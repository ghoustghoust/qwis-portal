<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17191d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="全网情报 · 只读门户：今日日报 / 热点榜 / 阅读器" />
    <title>全网情报</title>
    <script>
      // 主题初始化：localStorage(portal-theme) 优先，缺省跟随系统；首屏前设置避免闪烁
      try {
        var t = localStorage.getItem('portal-theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
