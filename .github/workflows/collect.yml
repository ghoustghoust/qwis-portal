# 全网情报系统 —— 云端定时管线（方案A，2026-09-11 重构）
#
# 核心变化：采集/日报/清理全部在 GH Actions runner 内直接执行 tools/collect-turso.js，
# 直写 Turso，不再经过 Vercel serverless 函数（Hobby 10s 限制 → 单次只能采 2 源的死局）。
# runner 在海外，YouTube/X/RSSHub/wechat2rss 全部直连，无需代理。
#
# Secrets 要求（Settings → Secrets and variables → Actions）：
#   TURSO_DATABASE_URL / TURSO_AUTH_TOKEN  Turso 连接
#   COLLECT_KEY                            仅保留给 Vercel 备份端点（手动触发用）
#
# Vercel 端 api/collect.js / api/daily-generate.js 保留为手动备份，不再是主链路。
name: collect

# snapshot job 需要 push 快照 commit
permissions:
  contents: write

on:
  schedule:
    # 全量采集：每 15 分钟（:07/:22/:37/:52 错峰）
    # GH Actions 定时任务在高负载时会延迟甚至丢弃——2026-09-11 曾连丢 03:07~05:07 五轮。
    # 采集是按 next_fetch_at 到期驱动的，空轮仅几秒成本，用密度换可靠性：
    # 即使丢掉一半，最坏延迟也只有 30 分钟。
    - cron: '7,22,37,52 * * * *'
    # 日报生成（UTC 1:03 = 北京 09:03）
    - cron: '3 1 * * *'
    # 静态快照（UTC 1:33 = 北京 09:33，日报后 30 分钟）
    - cron: '33 1 * * *'
    # 数据清理（UTC 20:13 = 北京 04:13 低峰期）
    - cron: '13 20 * * *'
    # AI 早报批处理（UTC 16:32 = 北京 00:32，自然日窗口闭合后；备跑兜底）
    - cron: '32 16 * * *'
    # 晚间生成主批（UTC 13:30 = 北京 21:30，滚动24h 窗口——T3-1 R0：晚间整理，次日早上呈现）
    - cron: '30 13 * * *'
    # 精选周刊（UTC 周五 10:03 = 北京周五 18:03，用户拍板周末阅读场景）
    - cron: '3 10 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行范围（cron-job.org 每 15min 触发时不传值 → 走默认 collect，不变量 9）'
        required: false
        type: choice
        default: collect
        options:
          - collect
          - daily-ai-evening
          - daily-ai
          - mybrief
          - weekly

jobs:
  # ─── 全量采集（每 15 分钟） ───
  collect:
    if: github.event.schedule == '7,22,37,52 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect due sources → Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # 2026-09-15 修：collect 尾部 quickscore 需 AI Key（缺 key 时评分静默全灭，精选断更根因）
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node tools/collect-turso.js collect

      - name: Translate pending English articles → Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node tools/collect-turso.js translate

  # ─── 日报生成（北京时间 09:03；仅 schedule——cron-job.org 每15min的 dispatch 只跑采集，防日报15min刷一份/快照15min推一个commit） ───
  daily-report:
    if: github.event.schedule == '3 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate daily report → Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/collect-turso.js daily

  # ─── 晚间生成主批（北京 21:30 / UTC 13:30，滚动 24h 窗口；T3-1 R0 晚间整理次日呈现）───
  # H27②：AI 主批搭上手动触发通道（每 15min dispatch 稳定敲门）——触发门不再依赖"定时事件串等值"
  # （GH 会把事件挂错档，周刊断更过一次）。跑不跑由步骤内的时间窗 + 当日产物 + 认领键判
  # （lib/daily-ai-claim.js）；显式 mode 补跑（GH_INPUT_MODE）不看窗、可强制重跑。
  daily-ai-evening:
    if: github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # M2（对抗审查）：dispatch 轮每 15min 一次，窗口判据必须在 npm ci 之前完成——
      # 窗口外整 job 成本压到秒级，否则 96 次/天的空 boot 会把 runner 额度打穿
      - name: Window check (dispatch 轮)
        id: win
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "daily-ai-evening" ]; then
            HM=$(TZ='Asia/Shanghai' date +%H%M)
            echo "北京时刻 $HM"
            if [ "$HM" -lt 2125 ]; then echo "in_window=false" >> "$GITHUB_OUTPUT"; else echo "in_window=true" >> "$GITHUB_OUTPUT"; fi
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"  # schedule 与显式 mode 补跑不查窗
          fi

      - name: Checkout repository
        if: steps.win.outputs.in_window == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.win.outputs.in_window == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.win.outputs.in_window == 'true'
        run: npm ci --ignore-scripts

      - name: Generate evening AI brief (rolling 24h) → Turso
        if: steps.win.outputs.in_window == 'true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # 2026-09-15 修：晚间主批此前缺 AI Key——深析全灭降级为关键词版（无评分产出）
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # H27②：窗口守卫只对"无 mode 的 dispatch 轮"生效；显式 mode 补跑（GH_INPUT_MODE）可强制重跑
          WINDOW_GUARD: '1'
          GH_INPUT_MODE: ${{ github.event.inputs.mode }}
        run: node tools/collect-turso.js daily-ai --rolling24 --window-guard

  # ─── AI 早报备跑兜底（北京 00:32 / UTC 16:32，自然日窗口闭合后；18-daily-ai-v2）───
  daily-ai:
    if: github.event.schedule == '32 16 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'daily-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate AI daily report → Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node tools/collect-turso.js daily-ai

  # ─── 我的早报重生成（无 cron，仅 dispatch mode=mybrief）───
  # 2026-09-18 新增：改完订阅/修完 bug 此前无法单独验证，只能等 21:30 批。
  # 此模式同时刷 reading.digest——阅读足迹过去只挂在 daily-ai 尾部，是它的历史缺口。
  mybrief:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'mybrief'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate my brief → Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node tools/collect-turso.js mybrief

  # ─── 精选周刊（北京周五 18:03；schedule 或 dispatch mode=weekly）───
  # 2026-09-18：原先只有 schedule 且每周仅此一次，GH 丢一次 run 就整周断更且无报警
  weekly:
    if: github.event.schedule == '3 10 * * 5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate weekly picks → Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: node tools/collect-turso.js weekly

  # ─── 静态快照生成（北京时间 09:33；仅 schedule） ───
  snapshot:
    if: github.event.schedule == '33 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate static snapshots
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/generate-snapshots.js

      - name: Commit and push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ static-data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update data snapshots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 并发 dispatch 可能撞车：先 rebase 再推，失败重试 3 次
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1

  # ─── 数据清理（北京时间 04:13；仅 schedule） ───
  cleanup:
    if: github.event.schedule == '13 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cleanup old hotlist articles (> 7 days)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/collect-turso.js cleanup
