# 全网情报系统 Vercel 部署 —— 定时采集与工作流
# 整点采集 / 日报生成 / 静态快照 / 数据清理
# COLLECT_KEY 在 GitHub 仓库 Settings → Secrets and variables → Actions 配置
# 生产地址：https://qwis-intel.vercel.app
name: collect

on:
  schedule:
    # 整点主采集（UTC，对应北京时间 +8）
    - cron: '0 * * * *'
    # 日报生成（UTC 0:00 = 北京 8:00）
    - cron: '0 0 * * *'
    # 静态快照生成（UTC 1:00 = 北京 9:00，日报生成后 1 小时）
    - cron: '0 1 * * *'
    # 数据清理（UTC 20:00 = 北京 4:00 低峰期）
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  # ─── 整点采集 ───
  collect-hourly:
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger hourly collection
        run: |
          curl -fsS -X POST "https://qwis-intel.vercel.app/api/collect?key=${{ secrets.COLLECT_KEY }}" \
            -H "Content-Type: application/json" \
            --max-time 90

  # ─── 日报生成 ───
  daily-report:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger daily report generation
        run: |
          curl -fsS -X POST "https://qwis-intel.vercel.app/api/daily-generate?key=${{ secrets.COLLECT_KEY }}&windowHours=48" \
            -H "Content-Type: application/json" \
            --max-time 120

  # ─── 静态快照生成 ───
  snapshot:
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate static snapshots
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node tools/generate-snapshots.js

      - name: Commit and push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "chore: update data snapshots $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

  # ─── 数据清理 ───
  cleanup:
    if: github.event.schedule == '0 20 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger data cleanup (delete old hotlist articles > 7 days)
        run: |
          curl -fsS -X POST "https://qwis-intel.vercel.app/api/collect?key=${{ secrets.COLLECT_KEY }}&mode=cleanup&days=7" \
            -H "Content-Type: application/json" \
            --max-time 60
