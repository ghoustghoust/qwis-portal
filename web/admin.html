<!doctype html>
<html lang="zh-CN" data-theme="warm-paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · 全网情报</title>
    <script>
      // 首屏前恢复主题，避免闪烁（与主入口同一套主题键）
      try {
        var t = localStorage.getItem('qw-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin.jsx"></script>
  </body>
</html>
